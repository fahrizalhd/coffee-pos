services:
  postgres:
    image: postgres:16
    container_name: coffee-pos-db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coffee_pos

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile

    container_name: coffee-pos-api

    restart: always

    working_dir: /app

    volumes:
      - ./apps/api:/app

    ports:
      - "8080:8080"

    depends_on:
      - postgres

volumes:
  postgres_data: