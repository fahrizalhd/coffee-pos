services:
  postgres:
    image: postgres:16
    container_name: coffee-pos-db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coffee_pos

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile

    container_name: coffee-pos-api
    restart: always

    working_dir: /app

    volumes:
      - ./apps/api:/app

    ports:
      - "8080:8080"

    depends_on:
      - postgres

  migrate:
    image: migrate/migrate

    volumes:
      - ./apps/api/migrations:/migrations

    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:postgres@postgres:5432/coffee_pos?sslmode=disable",
        "up"
      ]

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: